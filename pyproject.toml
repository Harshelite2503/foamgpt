[project]
name = "foamgpt"
version = "0.1.0"
description = "FoamGPT: LLM-extracted Process-Structure-Property dataset and benchmark for syntactic foams"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kunal Gupta" }]
dependencies = [
  "anthropic>=0.60",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pymupdf>=1.24",
  "typer>=0.12",
  "rich>=13.7",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "pyarrow>=16",
  "python-dotenv>=1.0",
  "tenacity>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.9"]

[project.scripts]
foamgpt = "foamgpt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foamgpt"]

[tool.ruff]
line-length = 100
target-version = "py311"
